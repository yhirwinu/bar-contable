<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smoothies y Algo Mas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-4xl font-bold mb-8 text-center text-blue-400">Smoothies y Algo Mas</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Columna Principal: Ventas e Inventario -->
            <div class="col-span-1 lg:col-span-2 space-y-6">
                
                <!-- Punto de Venta -->
                <div class="bg-gray-800 p-6 rounded-lg shadow-md border border-green-500">
                    <h2 class="text-xl font-semibold mb-4 text-green-400">Punto de Venta</h2>
                    <form id="formVenta" class="flex flex-col gap-4">
                        <select id="ventaProducto" required class="bg-gray-700 px-4 py-2 rounded text-white outline-none focus:ring-2 focus:ring-green-500">
                            <option value="" disabled selected>Seleccionar producto...</option>
                        </select>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <select id="ventaTipo" required class="bg-gray-700 px-4 py-2 rounded text-white outline-none focus:ring-2 focus:ring-green-500">
                                <option value="" disabled selected>Presentación / Promoción</option>
                                <option value="unidad">1 Unidad ($1 / 800 Bs)</option>
                                <option value="tobo6">Medio Tobo - 6 uds ($5 / 4.200 Bs)</option>
                                <option value="tobo12">Tobo Completo - 12 uds ($10 / 8.000 Bs)</option>
                            </select>

                            <select id="ventaMetodo" required class="bg-gray-700 px-4 py-2 rounded text-white outline-none focus:ring-2 focus:ring-green-500">
                                <option value="" disabled selected>Método de Pago</option>
                                <option value="dolares">Dólares Efectivo ($)</option>
                                <option value="bolivares">Bolívares (Pago Móvil/Efectivo)</option>
                            </select>
                        </div>

                        <button type="submit" class="bg-green-600 hover:bg-green-700 px-4 py-3 rounded font-bold transition text-lg mt-2 shadow-lg">Cobrar y Descontar Stock</button>
                    </form>
                </div>

                <!-- Inventario -->
                <div class="bg-gray-800 p-6 rounded-lg shadow-md">
                    <h2 class="text-xl font-semibold mb-4">Inventario Actual</h2>
                    <div id="listaInventario" class="space-y-2"></div>
                </div>
            </div>

            <!-- Columna Lateral: Cuentas y Usuarios -->
            <div class="col-span-1 space-y-6">
                
                <!-- Cuentas de Hoy -->
                <div class="bg-gray-800 p-6 rounded-lg shadow-md border border-yellow-500">
                    <h2 class="text-xl font-semibold mb-4 text-yellow-400">Cuentas de Hoy</h2>
                    <div class="flex flex-col gap-4 mb-4">
                        <div class="bg-gray-700 p-4 rounded text-center border-l-4 border-green-500">
                            <p class="text-sm text-gray-300">Total en Dólares</p>
                            <p class="text-3xl font-bold text-green-400" id="totalDolares">$0</p>
                        </div>
                        <div class="bg-gray-700 p-4 rounded text-center border-l-4 border-blue-500">
                            <p class="text-sm text-gray-300">Total en Bolívares</p>
                            <p class="text-3xl font-bold text-blue-400" id="totalBolivares">0 Bs</p>
                        </div>
                    </div>
                    <h3 class="text-sm font-semibold text-gray-400 mb-2 uppercase">Últimas Ventas</h3>
                    <div id="listaVentas" class="space-y-2 text-sm max-h-60 overflow-y-auto pr-2"></div>
                </div>

                <!-- Gestión de Usuarios -->
                <div class="bg-gray-800 p-6 rounded-lg shadow-md">
                    <h2 class="text-lg font-semibold mb-4">Usuarios Guardados</h2>
                    <div id="ListaUsuarios" class="space-y-2"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- GESTIÓN DE USUARIOS FRONTEND ---
        let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [{ usuario: 'admin' }, { usuario: 'yhirwin' }];

        function saveData() {
            localStorage.setItem('usuarios', JSON.stringify(usuarios));
            renderUsuarios();
        }

        function renderUsuarios() {
            const lista = document.getElementById('ListaUsuarios');
            lista.innerHTML = usuarios.map(u => `
                <div class="flex justify-between items-center bg-gray-700 p-3 rounded">
                    <span>${u.usuario}</span>
                    ${(u.usuario !== 'admin' && u.usuario !== 'yhirwin') ? `<button onclick="eliminarUsuario('${u.usuario}')" class="text-red-400 hover:text-red-500 text-sm transition">Eliminar</button>` : '<span class="text-gray-400 text-xs bg-gray-900 px-2 py-1 rounded">Sistema</span>'}
                </div>
            `).join('');
        }

        // --- CARGAR INVENTARIO Y SELECT ---
        async function cargarInventario() {
            try {
                const res = await fetch('/api/inventario');
                const data = await res.json();
                
                // Mostrar en la lista
                const contenedor = document.getElementById('listaInventario');
                contenedor.innerHTML = data.map(item => `
                    <div class="flex justify-between items-center bg-gray-700 p-4 rounded border-l-4 ${item.stock < 12 ? 'border-red-500' : 'border-blue-500'}">
                        <div>
                            <p class="font-bold text-lg">${item.nombre}</p>
                            <p class="text-sm text-gray-400">${item.categoria}</p>
                        </div>
                        <div class="text-right">
                            <span class="bg-gray-900 px-4 py-2 rounded text-xl font-bold block mb-1">${item.stock} <span class="text-sm text-gray-400">uds</span></span>
                        </div>
                    </div>
                `).join('');

                // Llenar el desplegable de ventas
                const selectProductos = document.getElementById('ventaProducto');
                selectProductos.innerHTML = '<option value="" disabled selected>Seleccionar producto...</option>' + 
                data.map(item => `<option value="${item.id}">${item.nombre}</option>`).join('');
                
            } catch (error) {
                console.error('Error al cargar inventario:', error);
            }
        }

        // --- PROCESAR VENTA ---
        document.getElementById('formVenta').addEventListener('submit', async (e) => {
            e.preventDefault();
            const idProducto = document.getElementById('ventaProducto').value;
            const tipoVenta = document.getElementById('ventaTipo').value;
            const metodoPago = document.getElementById('ventaMetodo').value;

            try {
                const res = await fetch('/api/ventas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idProducto, tipoVenta, metodoPago })
                });
                const data = await res.json();
                
                if(data.success) {
                    document.getElementById('formVenta').reset();
                    cargarInventario(); // Refresca inventario
                    cargarVentas();     // Refresca caja
                } else {
                    alert(data.message);
                }
            } catch (error) {
                console.error('Error al registrar venta:', error);
            }
        });

        // --- CARGAR CUENTAS DEL DÍA ---
        async function cargarVentas() {
            try {
                const res = await fetch('/api/ventas');
                const ventas = await res.json();
                
                let totDolares = 0;
                let totBolivares = 0;

                const contenedor = document.getElementById('listaVentas');
                
                // Mostramos las ventas más recientes primero (reverse)
                contenedor.innerHTML = ventas.slice().reverse().map(v => {
                    let formatoMonto = '';
                    if (v.metodoPago === 'dolares') {
                        totDolares += v.monto;
                        formatoMonto = `$${v.monto}`;
                    } else {
                        totBolivares += v.monto;
                        formatoMonto = `${v.monto} Bs`;
                    }

                    let promoText = v.tipoVenta === 'unidad' ? '1 Ud' : (v.tipoVenta === 'tobo6' ? 'Medio (6)' : 'Tobo (12)');

                    return `
                    <div class="flex justify-between items-center bg-gray-700 p-2 rounded mb-1">
                        <span class="text-gray-300">${promoText}</span>
                        <span class="${v.metodoPago === 'dolares' ? 'text-green-400' : 'text-blue-400'} font-bold text-base">+ ${formatoMonto}</span>
                    </div>
                    `;
                }).join('') || '<p class="text-gray-500 text-center italic py-2">Sin ventas aún.</p>';

                // Actualizar números grandes
                document.getElementById('totalDolares').innerText = `$${totDolares}`;
                document.getElementById('totalBolivares').innerText = `${totBolivares} Bs`;

            } catch (error) {
                console.error('Error al cargar ventas:', error);
            }
        }

        // --- INICIALIZAR ---
        renderUsuarios();
        cargarInventario();
        cargarVentas();
    </script>
</body>
</html>
