<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Contable - Bar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-center">Sistema Contable - Bar</h1>
        
        <!-- Gestión de Usuarios -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4">Gestión de Usuarios</h2>
            <form id="formUsuario" class="flex gap-4 mb-4">
                <input type="text" id="usuarioInput" placeholder="Nombre de usuario" required class="bg-gray-700 px-4 py-2 rounded text-white flex-1 outline-none focus:ring-2 focus:ring-blue-500">
                <input type="password" id="passwordInput" placeholder="Contraseña" required class="bg-gray-700 px-4 py-2 rounded text-white flex-1 outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded font-semibold transition">Agregar</button>
            </form>
            <div id="ListaUsuarios" class="space-y-2"></div>
        </div>

        <!-- Inventario -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Inventario Actual (Desde el Servidor)</h2>
            <div id="listaInventario" class="space-y-2"></div>
        </div>
    </div>

    <script>
        let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [{ usuario: 'admin' }];

        function saveData() {
            localStorage.setItem('usuarios', JSON.stringify(usuarios));
            renderUsuarios();
        }

        function renderUsuarios() {
            const lista = document.getElementById('ListaUsuarios');
            lista.innerHTML = usuarios.map(u => `
                <div class="flex justify-between items-center bg-gray-700 p-3 rounded">
                    <span><b>Usuario:</b> ${u.usuario}</span>
                    ${u.usuario !== 'admin' ? `<button onclick="eliminarUsuario('${u.usuario}')" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-sm transition">Eliminar</button>` : '<span class="text-gray-400 text-sm">Principal</span>'}
                </div>
            `).join('');
        }

        function eliminarUsuario(u) {
            if (confirm(`¿Eliminar usuario ${u}?`)) {
                usuarios = usuarios.filter(x => x.usuario !== u);
                saveData();
            }
        }

        document.getElementById('formUsuario').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('usuarioInput').value;
            const p = document.getElementById('passwordInput').value;
            if (usuarios.some(x => x.usuario === u)) {
                alert('El usuario ya existe');
                return;
            }
            usuarios.push({ usuario: u, password: p });
            document.getElementById('formUsuario').reset();
            saveData();
        });

        async function cargarInventario() {
            try {
                const res = await fetch('/api/inventario');
                const data = await res.json();
                const contenedor = document.getElementById('listaInventario');
                contenedor.innerHTML = data.map(item => `
                    <div class="flex justify-between items-center bg-gray-700 p-3 rounded">
                        <span>${item.nombre} <small class="text-gray-400">(${item.categoria})</small></span>
                        <span class="bg-blue-900 px-3 py-1 rounded text-sm font-bold">Stock: ${item.stock}</span>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error al cargar inventario:', error);
            }
        }

        renderUsuarios();
        cargarInventario();
    </script>
</body>
</html>
