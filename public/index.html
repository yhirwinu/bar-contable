<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema - Smoothies y Algo Mas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .bg-navy { background-color: #0f2438; }
    .bg-terracotta { background-color: #c84b23; }
  </style>
</head>
<body class="bg-gray-100">

  <!-- LOGIN -->
  <div id="loginScreen" class="min-h-screen bg-navy flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl w-full max-w-sm">
      <h1 class="text-xl font-bold text-center mb-6">SMOOTHIES Y ALGO MAS</h1>
      <form id="loginForm" class="space-y-4">
        <input type="text" id="username" placeholder="Usuario" class="w-full p-2 border rounded" required>
        <input type="password" id="password" placeholder="Contraseña" class="w-full p-2 border rounded" required>
        <button type="submit" class="w-full bg-terracotta text-white py-2 rounded font-bold">Ingresar</button>
      </form>
    </div>
  </div>

  <!-- APP -->
  <div id="appScreen" class="hidden min-h-screen flex">
    <aside class="w-64 bg-navy text-white p-6">
      <h2 class="font-bold mb-6">SMOOTHIES Y ALGO MAS</h2>
      <button onclick="nav('inicio')" class="block w-full text-left py-2 hover:text-orange-400">Ventas</button>
      <button onclick="nav('inventario')" class="block w-full text-left py-2 hover:text-orange-400">Inventario</button>
    </aside>

    <main class="flex-1 p-8">
      <!-- VENTA -->
      <div id="view-inicio" class="view-panel">
        <h2 class="text-2xl font-bold mb-4">Registrar Venta</h2>
        <form id="formVenta" class="bg-white p-6 rounded shadow space-y-4">
          <select id="ventaProducto" class="w-full p-2 border rounded"></select>
          <select id="ventaPresentacion" class="w-full p-2 border rounded">
            <option value="1">Unidad (1)</option>
            <option value="6">Medio Tobo (6)</option>
            <option value="12">Tobo Completo (12)</option>
          </select>
          <select id="ventaMoneda" class="w-full p-2 border rounded">
            <option value="USD">Dólares ($)</option>
            <option value="BS">Bolívares (Bs)</option>
          </select>
          <button type="submit" class="w-full bg-terracotta text-white py-2 rounded">Confirmar Venta</button>
        </form>
      </div>

      <!-- INVENTARIO -->
      <div id="view-inventario" class="view-panel hidden">
        <h2 class="text-2xl font-bold mb-4">Inventario</h2>
        <div id="tablaInventario" class="bg-white p-4 rounded shadow"></div>
      </div>
    </main>
  </div>

  <script>
    // Lógica básica de navegación y fetch
    function nav(view) {
      document.querySelectorAll('.view-panel').forEach(el => el.classList.add('hidden'));
      document.getElementById(`view-${view}`).classList.remove('hidden');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ usuario: document.getElementById('username').value, password: document.getElementById('password').value })
      });
      const data = await res.json();
      if(data.success) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('appScreen').classList.remove('hidden');
        cargarDatos();
      } else { alert('Usuario o contraseña incorrectos'); }
    });

    async function cargarDatos() {
        const res = await fetch('/api/inventario');
        const inv = await res.json();
        const select = document.getElementById('ventaProducto');
        select.innerHTML = inv.map(p => `<option value="${p.id}">${p.nombre} (Stock: ${p.stock})</option>`).join('');
        
        document.getElementById('tablaInventario').innerHTML = inv.map(p => `<div>${p.nombre}: ${p.stock} unids</div>`).join('');
    }

    document.getElementById('formVenta').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('/api/vender', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                productoId: document.getElementById('ventaProducto').value,
                presentacion: document.getElementById('ventaPresentacion').value,
                moneda: document.getElementById('ventaMoneda').value
            })
        });
        const data = await res.json();
        alert(data.message);
        cargarDatos();
    });
  </script>
</body>
</html>
